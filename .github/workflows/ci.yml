name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo fmt --manifest-path crates/ccr-importer/Cargo.toml -- --check
      - run: cargo test --manifest-path crates/ccr-importer/Cargo.toml --locked
