name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ccr" "dist/ccr-${{ matrix.target }}"
          chmod +x "dist/ccr-${{ matrix.target }}"
          mkdir -p package
          cp "dist/ccr-${{ matrix.target }}" package/
          cp LICENSE package/LICENSE
          cp crates/ccr-importer/UPSTREAM-LICENSE package/THIRD_PARTY_NOTICES
          tar -C package -czf "dist/ccr-${{ matrix.target }}.tar.gz" "ccr-${{ matrix.target }}" LICENSE THIRD_PARTY_NOTICES
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ccr-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            LICENSE
            crates/ccr-importer/UPSTREAM-LICENSE
          generate_release_notes: true

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: verify release artifact and publish to npm
        working-directory: npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' ../Cargo.toml | head -1)"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          TARBALL="$(npm pack --silent)"

          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          unset CCR_LOCAL_BINARY CCR_BINARY_PATH
          npm install --prefix "$SMOKE_DIR" --no-audit --no-fund "$TARBALL"
          ACTUAL="$("$SMOKE_DIR/node_modules/.bin/ccr" --version)"
          if [ "$ACTUAL" != "ccr $VERSION" ]; then
            echo "安装后版本校验失败：期望 ccr $VERSION，实际 $ACTUAL" >&2
            exit 1
          fi
          echo "已通过 GitHub Release 实物安装验证：$ACTUAL"

          # 没配 NPM_TOKEN 就跳过，不让 CI 变红
          if ! npm whoami >/dev/null 2>&1; then
            echo "::notice::未配置可用的 NPM_TOKEN，跳过 npm 发布"
            exit 0
          fi
          echo "发布 cc-remote-usage@$VERSION"
          npm publish "$TARBALL" --access public
