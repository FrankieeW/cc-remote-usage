[package]
name = "ccr-importer"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
chrono = "0.4"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = "1"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
