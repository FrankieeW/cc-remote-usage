[package]
name = "cc-remote-usage"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "把服务器上 Codex / Claude Code agent 的用量同步进 CC Switch"
license = "MIT"

[[bin]]
name = "ccr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
dialoguer = "0.12"

[profile.release]
lto = true
strip = true
